[package]
name = "helix-desktop"
version = "1.0.0"
description = "Hélix - Plataforma de Grafos Inteligente (Desktop)"
authors = ["Ministério Público"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "helix_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
rfd = "0.15"
